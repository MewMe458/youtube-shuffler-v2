<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Playlist Shuffler</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
            line-height: 1.5;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        button {
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            align-self: flex-start;
        }
        button:hover {
            background-color: #cc0000;
        }
        #output {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        .video-link {
            display: block;
            padding: 10px;
            background: #f4f4f4;
            border: 1px solid #ddd;
            border-radius: 4px;
            text-decoration: none;
            color: #333;
        }
        .video-link:hover {
            background: #e9e9e9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>YouTube Playlist Shuffler</h1>
        <p>Enter the YouTube Playlist URL:</p>
        <input type="text" id="apiKey" placeholder="Enter YouTube API Key" style="width: 100%; padding: 0.5rem; margin-bottom: 1rem; box-sizing: border-box;">
        <input type="text" id="playlistUrl" placeholder="https://www.youtube.com/playlist?list=..." style="width: 100%; padding: 0.5rem; margin-bottom: 1rem; box-sizing: border-box;">
        <button onclick="shufflePlaylist()">Shuffle Playlist</button>
        <div id="output"></div>
    </div>

    <script>
        async function shufflePlaylist() {
            const urlInput = document.getElementById('playlistUrl').value.trim();
            const outputDiv = document.getElementById('output');
            
            if (!urlInput) {
                alert('Please enter a playlist URL.');
                return;
            }

            // Extract Playlist ID from URL
            const urlParams = new URLSearchParams(new URL(urlInput).search);
            const listId = urlParams.get('list');

            if (!listId) {
                alert('Invalid YouTube playlist URL. Please make sure it contains "list=ID".');
                return;
            }

            outputDiv.innerHTML = 'Loading and shuffling videos...';

            try {
                /* 
                   Note: To actually fetch videos from a YouTube playlist, you need the YouTube Data API.
                   Since we are in a client-side HTML file without a backend or API Key, 
                   we will simulate the fetching process or provide a way to handle the links.
                   For a real implementation, the user would provide their API key.
                */
                
                // In a real scenario, you would fetch from: 
                // https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=${listId}&key=YOUR_API_KEY
                
                const apiKey = document.getElementById('apiKey').value.trim();
                if (!apiKey) {
                    alert('Please enter your YouTube API Key.');
                    return;
                }

                let videos = [];
                let nextPageToken = '';

                do {
                    // Include pageToken in the URL to get the next set of results
                    const response = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=${listId}&pageToken=${nextPageToken}&key=${apiKey}`);
                    const data = await response.json();

                    if (data.error) {
                        throw new Error(data.error.message);
                    }

                    // Collect video URLs from the current batch
                    const batch = data.items.map(item => `https://www.youtube.com/watch?v=${item.snippet.resourceId.videoId}`);
                    videos = videos.concat(batch);

                    // Update the token for the next request, or set to empty to stop the loop
                    nextPageToken = data.nextPageToken || '';
                } while (nextPageToken);
                
                if (videos.length === 0) {
                    outputDiv.innerHTML = 'No videos found in this playlist.';
                    return;
                }

                // Fisher-Yates (Knuth) Shuffle
                for (let i = videos.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [videos[i], videos[j]] = [videos[j], videos[i]];
                }

                outputDiv.innerHTML = '';
                
                // Use the YouTube IFrame Player API for sequence control
                const statusDiv = document.createElement('div');
                statusDiv.id = 'status';
                statusDiv.style.textAlign = 'center';
                statusDiv.style.fontWeight = 'bold';
                statusDiv.style.marginBottom = '10px';
                outputDiv.appendChild(statusDiv);

                const playerDiv = document.createElement('div');
                playerDiv.id = 'player';
                outputDiv.appendChild(playerDiv);

                // Load the YouTube IFrame API script
                const tag = document.createElement('script');
                tag.src = 'https://www.youtube.com/iframe_api';
                document.head.appendChild(tag);

                let currentIndex = 0;
                let player;

                window.onYouTubeIframeAPIReady = () => {
					document.getElementById('status').innerText = `Video 1/${videos.length}`;
                    player = new YT.Player('player', {
                        height: '315',
                        width: '560',
                        videoId: videos[0].split('v=')[1],
                        events: {
                            'onStateChange': (event) => {
                                // YT.PlayerState.ENDED = 0
                                if (event.data === YT.PlayerState.ENDED) {
                                    playNext();
                                }
                            }
                        }
                    });
                };

                function playNext() {
                    currentIndex++;
                    if (currentIndex < videos.length) {
                        document.getElementById('status').innerText = `Video ${currentIndex + 1}/${videos.length}`;
                        const nextVideoId = videos[currentIndex].split('v=')[1];
                        player.loadVideoById(nextVideoId);
                    } else {
                        document.getElementById('status').innerText = 'Finished!';
                        outputDiv.innerHTML += '<p>All videos in the shuffled list have played!</p>';
                    }
                }

            } catch (error) {
                outputDiv.innerHTML = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
